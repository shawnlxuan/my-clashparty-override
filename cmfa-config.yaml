# ---------------------------------------------------------------------------
# ChatGPT App「SSL 配置错误」结论（不是 OpenAI 单独发明的奇怪协议）
#
# 1) App 侧：官方客户端有证书钉扎。它要求连到 chatgpt.com 时，证书链、
#    SNI、目标地址一致。任何「先连假 IP / 再改写目标」都会被它报成 SSL 错误。
#    浏览器通常不钉扎，所以同一份配置下网页能开、App 报 SSL。
#
# 2) 内核侧：Mihomo 默认 sniffer.override-destination=true。嗅探到 SNI 后
#    会丢掉原来的目标 IP，再走一遍 DNS。和 fake-ip 叠在一起时，ChatGPT
#    实际连的是 198.18.x.x，钉扎失败。这是配置踩中内核默认行为，不是内核
#    随机损坏证书。
#
# 3) 本文件已做：OpenAI/ChatGPT 域名不进 fake-ip；嗅探只辅助分流、
#    不 override-destination；不嗅探 QUIC；prefer-h3=false。
#
# 4) 若仍报 SSL：先看连接日志。若是
#    chatgpt.com → 🤖 AI代理 → panel.xxx:34883 i/o timeout
#    那是节点端口被当前网络拦截，App 也会把握手失败显示成 SSL 错误。
#    这和分流无关，需要机场提供 443 入口。
# ---------------------------------------------------------------------------

