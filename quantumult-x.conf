https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/AdvertisingLite/AdvertisingLite.list, tag=AdvertisingLite, force-policy=reject, update-interval=86400, opt-parser=false, enabled=true
https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/OpenAI/OpenAI.list, tag=OpenAI, force-policy=🤖 AI代理, update-interval=86400, opt-parser=false, enabled=true
